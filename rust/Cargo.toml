[workspace]
members = [".", "derive"]

[workspace.package]
version = "3.0.0-rc.1"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/deepnoodle-ai/risor"
homepage = "https://risor.io"

[package]
name = "risor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/risor"
readme = "README.md"
description = "Risor v3: a small, statically checked, bounded expression language for embedding"
keywords = ["expression", "embedded", "language", "sandbox", "scripting"]
categories = ["compilers", "config", "template-engine", "parser-implementations"]
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "data/*.json",
    "src/**/*.rs",
    "!src/bin/**",
]

[lib]
path = "src/lib.rs"

# The library has no dependency from outside this repository, and neither do
# the tests: the case-file runner reads JSON with the crate's own strict
# reader (`src/json.rs`), which also reports a repeated key, as `03-host.md`
# 3.10.10 requires. The one dependency is this repository's own derive crate,
# behind the feature `derive`, off by default (ruling BB26).
[dependencies]
risor-derive = { version = "=3.0.0-rc.1", path = "derive", optional = true }

[features]
derive = ["dep:risor-derive"]

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

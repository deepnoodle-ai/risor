[package]
name = "risor"
version = "0.1.0"
edition = "2021"
description = "Risor v3: an embedded expression language, written from its specification"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

# The derive of F1 6.3 is a crate of its own, `derive/`, so that this crate
# keeps no dependency. Build and test it with `-p risor-derive` or
# `--workspace`.
[workspace]
members = [".", "derive"]

# The library has no dependencies, and neither do the tests: the case-file
# runner reads JSON with the crate's own strict reader (`src/json.rs`), which
# also reports a repeated key, as `03-host.md` 3.10.10 requires.
[dependencies]

[dev-dependencies]

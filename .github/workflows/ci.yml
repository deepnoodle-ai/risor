name: ci

# The three implementations of Risor v3, each run against the conformance
# suite in suite/: Go in go/, TypeScript in ts/, Rust in rust/. Risor v2 is
# on the v2 branch, tested by its own ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "ts/**"
      - "web/**"
      - "rust/**"
      - "fuzz/**"
      - "suite/**"
      - "docs/library/**"
      - "docs/migrating.md"
      - "docs/scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "go/**"
      - "ts/**"
      - "web/**"
      - "rust/**"
      - "fuzz/**"
      - "suite/**"
      - "docs/library/**"
      - "docs/migrating.md"
      - "docs/scripts/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/cmd/risor/go.sum

      - name: Verify zero dependencies in go/go.mod
        run: |
          if grep -q '^require' go.mod; then
            echo "go/go.mod must have no require directives (D23)"
            cat go.mod
            exit 1
          fi
          if [ -e go.sum ]; then
            echo "go/go.sum must not exist when go/go.mod has zero dependencies (D23)"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test, with the conformance suite
        run: go test -count=1 ./...

      - name: Test with the race detector
        run: go test -count=1 -race ./...

      - name: Build CLI (go/cmd/risor)
        working-directory: go/cmd/risor
        run: go build ./...

      - name: Vet CLI (go/cmd/risor)
        working-directory: go/cmd/risor
        run: go vet ./...

      - name: Test CLI (go/cmd/risor)
        working-directory: go/cmd/risor
        run: go test -count=1 ./...

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Conformance suite
        run: npm run suite

      # The package as npm would publish it: prepack builds dist/.
      - name: Pack the npm package
        run: npm pack --dry-run

  # The npm packages for Risor in the browser (docs/design/web-packages.md).
  # They build against ts/ through the npm workspace in web/.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # PRD UC-1: Risor's code on the page's main thread, without React,
      # Mantine and CodeMirror, stays under its limit.
      - name: Main-thread size
        run: npm run size

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The toolchain is pinned in rust/rust-toolchain.toml, so a new compiler
      # release cannot fail a pull request that did not touch Rust.
      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # The workspace is the library and its derive crate, rust/derive. The
      # build uses the default features; the lint and the tests turn on every
      # feature, so the re-exported derive is tested.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The limits must hold in the build that uses the most stack, so the
      # suite runs unoptimized and optimized.
      - name: Test, unoptimized
        run: cargo test --workspace --all-features

      - name: Test, optimized
        run: cargo test --workspace --all-features --release

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 22.18+ enables native TypeScript stripping for ts/src/index.ts.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ">=22.18.0 <23"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Check generated library reference
        run: node docs/scripts/generate-library-docs.mjs --check

      - name: Test library reference generator
        run: node --test docs/scripts/generate-library-docs.test.mjs

      - name: Verify migration guide examples
        run: node docs/scripts/check-migrating-examples.mjs

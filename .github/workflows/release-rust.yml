name: release-rust

# Publishes `risor-derive` and `risor` to crates.io on the tag
# `rust-v<version>`, such as `rust-v3.0.0-alpha.2` or `rust-v3.0.0`.
# Never push a bare `v3.*` tag (AGENTS.md).
# `rust/scripts/version.sh` sets both crate versions and the exact
# `risor-derive` pin in lockstep.

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run without publishing to crates.io"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Verify crate versions and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 - <<'PY'
          import json, os, subprocess, sys

          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          ))
          pkgs = {p["name"]: p for p in meta["packages"]}
          risor = pkgs["risor"]
          derive = pkgs["risor-derive"]
          if risor["version"] != derive["version"]:
              sys.exit(f"version mismatch: risor={risor['version']} risor-derive={derive['version']}")
          v = risor["version"]
          deps = [d for d in risor["dependencies"] if d["name"] == "risor-derive"]
          if len(deps) != 1 or deps[0]["req"] != f"={v}":
              sys.exit(f"risor-derive dep must be pinned to '={v}', found: {deps}")
          ref_type = os.environ.get("REF_TYPE")
          if ref_type == "tag":
              tag = os.environ["REF_NAME"]
              if tag != f"rust-v{v}":
                  sys.exit(f"tag {tag} does not match crate version {v}")
          elif os.environ.get("EVENT_NAME") == "workflow_dispatch" and os.environ.get("DRY_RUN") != "true":
              sys.exit("publishing requires a rust-v<version> tag; run with dry_run=true on branches")
          print(v)
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Verified workspace version: ${version}"

      - name: Verify bundled suite data and license
        run: ./scripts/sync-data.sh --check

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Dry-run publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish --workspace --dry-run --all-features

      - name: Publish risor-derive and risor
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set" >&2
            exit 1
          fi

          crate_published() {
            crate="$1"
            ver="$2"
            prefix1="$(printf '%s' "$crate" | cut -c1-2)"
            prefix2="$(printf '%s' "$crate" | cut -c3-4)"
            curl -sf -A "risor-release-workflow (https://github.com/deepnoodle-ai/risor)" \
              "https://index.crates.io/${prefix1}/${prefix2}/${crate}" \
              | grep -Fq "\"vers\":\"${ver}\""
          }

          if crate_published "risor-derive" "$VERSION"; then
            echo "risor-derive ${VERSION} is already on crates.io; skipping"
          else
            cargo publish -p risor-derive
          fi

          # Wait for crates.io sparse index propagation before publishing `risor`.
          ready=0
          for attempt in $(seq 1 24); do
            if crate_published "risor-derive" "$VERSION"; then
              echo "risor-derive ${VERSION} is live in the crates.io index"
              ready=1
              break
            fi
            echo "Waiting for risor-derive ${VERSION} in crates.io index (attempt ${attempt}/24)..."
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for risor-derive ${VERSION} in crates.io index" >&2
            exit 1
          fi

          if crate_published "risor" "$VERSION"; then
            echo "risor ${VERSION} is already on crates.io; skipping"
          else
            cargo publish -p risor --all-features
          fi

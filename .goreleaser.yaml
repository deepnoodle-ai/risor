version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: "standard"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    ignore:
      - goos: windows
        goarch: arm64
    dir: ./cmd/risor
    main: .
archives:
  - id: "standard"
    ids:
      - "standard"
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
homebrew_casks:
  - name: risor
    ids:
      - "standard"
    binaries:
      - risor
    skip_upload: false
    repository:
      owner: deepnoodle-ai
      name: homebrew-risor
    commit_author:
      name: Curtis Myzie
      email: info@cmds.dev
    directory: Casks
    url:
      verified: github.com/deepnoodle-ai/risor/
    homepage: "https://github.com/deepnoodle-ai/risor"
    description: "An embedded scripting language for Go projects"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/risor"]
          end
